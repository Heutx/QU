{% extends "layouts/base.html" %}
{% load static %}

{% block title %} List of Books {% endblock title %}

{% block stylesheets %}
  <style>
    h1{ color: green; }
    h2{ color: lightskyblue; }
    p { font-family: verdana; font-size: 20px; }
  </style>
{% endblock stylesheets %}

{% block content %}
    <h1>List of Books</h1>
    <a href="{% url 'books.view_one_book' 123 %}"><h2>1) The Kind Little Bird</h2></a>
    <a href="{% url 'books.view_one_book' 123 %}"><img src="{% static 'book1.jpg' %}" alt="The Kind Little Bird" width="200" height="200"></a>
    <hr>
    <h2>2) Ugly Man: Stories</h2>
    <img src="{% static 'book2.jpg' %}" alt="Ugly Man by Dennis Cooper" width="200" height="200">
    <hr>
    <h2>3) 1000 Black Umbrellas</h2>
    <img src="{% static 'book3.jpg' %}" alt="1000 Black Umbrellas by Daniel McGinn" width="200" height="200">
    <hr>
{% endblock content %}
